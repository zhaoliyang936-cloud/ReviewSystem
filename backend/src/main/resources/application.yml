server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  error:
    whitelabel:
      enabled: false
spring:
  application:
    name: reviewsystem
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reviewsystem}
    username: ${DB_USER:reviewsystem}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
app:
  question-assets:
    directory: ${QUESTION_ASSET_DIR:${user.home}/.reviewsystem/question-assets}
  ai:
    enabled: ${AI_ENABLED:false}
